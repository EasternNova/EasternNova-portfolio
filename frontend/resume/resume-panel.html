<aside
    id="resume-panel"
    class="resume-overlay"
    aria-hidden="true"
    aria-label="Prachi Shaw Resume"
    hidden
>
    <div class="resume-window">
        <div class="resume-mobile-panel-header">
            <div class="resume-mobile-panel-identity">
                <span class="resume-mobile-panel-icon" aria-hidden="true">▣</span>
                <div>
                    <strong>Résumé</strong>
                    <span>Prachi Shaw · Live Resume</span>
                </div>
            </div>

            <div class="resume-mobile-panel-actions">
                <a
                    href="/resume/resume.html"
                    target="_blank"
                    rel="noopener"
                    aria-label="Open resume in a new tab"
                >↗</a>
                <button
                    type="button"
                    id="resume-mobile-panel-close"
                    aria-label="Close resume"
                >×</button>
            </div>
        </div>

        <iframe
            id="resume-frame"
            title="Prachi Shaw — Live Resume"
        ></iframe>

        <div class="resume-mobile-panel-footer">
            <div class="resume-mobile-footer-symbols" aria-hidden="true">
                <img src="/resume/Rassets/sun.png" alt="">
                <img src="/resume/Rassets/hibiscus.png" alt="">
                <img src="/resume/Rassets/moon.png" alt="">
            </div>
            <div class="resume-mobile-footer-label">
                <span>● ○ LIVING RESUME</span>
                <span>● ○ AUTO-UPGRADES</span>
            </div>
        </div>
    </div>
</aside>
