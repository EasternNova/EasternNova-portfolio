
<!DOCTYPE html>
<html lang="en" data-resume-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>EasternNova | 3D Flower Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #080710;
      color: #f7eaf1;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .test-header {
      position: relative;
      z-index: 2;
      padding: 24px;
      text-align: center;
      pointer-events: none;
    }

    .test-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 4vw, 2.5rem);
    }

    .test-header p {
      margin: 0;
      color: #b9c6d7;
      font-size: 0.9rem;
    }

    .test-controls {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px;
    }

    button {
      border: 1px solid #557987;
      border-radius: 999px;
      padding: 10px 16px;
      color: inherit;
      background: #10232e;
      cursor: pointer;
    }

    button:hover {
      background: #193c4a;
    }

    #test-status {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 12px auto;
      padding: 12px 16px;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #a6e6c2;
      font-size: 0.9rem;
    }

    .test-scene {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 65vh;
      padding: 24px;
    }

    .test-scene::before {
      content: "";
      position: absolute;
      width: min(70vw, 500px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(48, 131, 157, 0.16),
        transparent 70%
      );
      pointer-events: none;
    }

    .test-note {
      position: relative;
      z-index: 2;
      max-width: 600px;
      margin: 0 auto 40px;
      padding: 20px;
      color: #b9c6d7;
      line-height: 1.7;
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="test-header">
    <h1>EasternNova — 3D Flower Lab</h1>
    <p>Isolated test · No resume CSS · No PNG assets</p>
  </header>

  <div class="test-controls">
    <button id="theme-toggle" type="button">Switch theme</button>
    <button id="reload-test" type="button">Reload test</button>
  </div>

  <div id="test-status" role="status" aria-live="polite">
    Loading Three.js and the Living Resume scene…
  </div>

  <main class="test-scene">
    <div class="test-note">
      The procedural 3D flower should appear behind this text.
      If it doesn't, check the status above and the browser console.
    </div>
  </main>

  <script>
    const status = document.querySelector("#test-status");
    const themeButton = document.querySelector("#theme-toggle");
    const reloadButton = document.querySelector("#reload-test");

    themeButton.addEventListener("click", () => {
      const html = document.documentElement;
      html.dataset.resumeTheme =
        html.dataset.resumeTheme === "dark" ? "light" : "dark";

      document.body.style.background =
        html.dataset.resumeTheme === "light" ? "#fff5f8" : "#080710";

      document.body.style.color =
        html.dataset.resumeTheme === "light" ? "#241624" : "#f7eaf1";

      status.textContent =
        "Theme changed to " + html.dataset.resumeTheme +
        ". This tests the feature's theme detection.";
    });

    reloadButton.addEventListener("click", () => location.reload());

    window.addEventListener("error", event => {
      status.textContent = "JavaScript error: " + event.message;
    });

    window.addEventListener("unhandledrejection", event => {
      status.textContent =
        "Loading error: " +
        (event.reason?.message || String(event.reason));
    });

    // The module below updates this status when it loads.
    window.addEventListener("enova-3d-ready", event => {
      status.textContent = event.detail?.message || "3D scene initialized.";
    });
  </script>

  <script type="module" src="./living-resume-3d.js"></script>
</body>
</html>
