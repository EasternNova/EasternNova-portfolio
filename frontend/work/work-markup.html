<section
    id="work"
    class="section section-work"
    aria-labelledby="work-title"
>
    <div class="work-pin">

        <header class="work-heading">
            <p class="eyebrow">Selected Work</p>

            <h2 id="work-title">
                Projects
            </h2>
            <p>
                A collection of projects, experiments,
                and things currently being built.
            </p>
        </header>

        <div
            class="work-viewport"
            aria-label="Selected projects"
        >
            <div
                id="work-project-rail"
                class="work-project-rail"
            ></div>
        </div>
        <div class="work-project-title-row">
            <h3>${project.title}</h3>

            <span
                class="work-project-arrow"
                aria-hidden="true"
            >
                ↗
            </span>
        </div>

    </div>
</section>
